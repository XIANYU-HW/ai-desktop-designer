<!doctype html>
<html lang="zh-CN" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Desktop</title>
  <!-- Add licensed artwork and bundled fonts when the chosen design needs them. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Replace this static layer with the requested art/media; a canvas loop is optional. -->
  <div class="scene" aria-hidden="true"></div>
  <main class="workspace">
    <!-- These bindings are examples; choose data and placement from the user's brief. -->
    <header class="info">
      <p class="clock" data-orbit-clock="{HH}:{mm}"></p>
      <p class="date" data-orbit-clock="{month}{D}日 {weekday}" data-en-clock="{wd}, {mon} {D}"></p>
      <p class="weather"><span data-orbit-weather="condition"></span> <span data-orbit-weather="temperature"></span></p>
    </header>
    <!-- Add only requested controls, using data-orbit-action/op/params and matching uses.actions. -->
    <nav class="controls" aria-label="桌面功能" data-en-label="Desktop functions"></nav>
    <p class="status" data-orbit-status role="status" aria-live="polite"></p>
    <p class="demo-note" data-en="Preview · sample data">预览 · 示例数据</p>
  </main>
  <script src="../../sdk/orbit.js"></script>
  <script src="scene.js"></script>
</body>
</html>
