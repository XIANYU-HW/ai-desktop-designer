<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My theme</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- The scene: anything that moves or is painted. Keep it behind the controls. -->
<canvas id="scene" aria-hidden="true"></canvas>

<!-- Information the world shows. Bindings fill these in; rename and restyle them freely. -->
<header class="info">
  <p class="clock" data-orbit-clock="{HH}:{mm}"></p>
  <p class="date" data-orbit-clock="{month}{D}日 {weekday}" data-en-clock="{wd}, {mon} {D}"></p>
  <p class="weather"><span data-orbit-weather="condition"></span> <span data-orbit-weather="temperature"></span></p>
</header>

<!-- Functions, named in the world's own words. Every op needs a designed running/done/unavailable state. -->
<nav class="controls" aria-label="Functions">
  <button class="control" data-orbit-action="tidy-files" data-orbit-op="run">
    <span class="control-name" data-en="Tidy">收纳</span>
    <span class="control-note"><b data-orbit-value="tidy-files.pending"></b> <span data-en="loose files">个散落文件</span></span>
  </button>
  <button class="control minor" data-orbit-action="tidy-files" data-orbit-op="undo">
    <span class="control-name" data-en="Undo">撤销</span>
  </button>
  <button class="control" data-orbit-action="quit-apps" data-orbit-op="run">
    <span class="control-name" data-en="Wind down">收工</span>
    <span class="control-note"><b data-orbit-value="quit-apps.open"></b> <span data-en="apps open">个应用开着</span></span>
  </button>
  <button class="control minor" data-orbit-action="quit-apps" data-orbit-op="reopen">
    <span class="control-name" data-en="Reopen">重新打开</span>
  </button>
</nav>

<!-- The latest message from any function. -->
<p class="status" data-orbit-status></p>

<script src="../../sdk/orbit.js"></script>
<script src="scene.js"></script>
</body>
</html>
