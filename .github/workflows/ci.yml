name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ORBIT_WORKSPACE: ${{ github.workspace }}/.ci-workspace
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit and integration tests
        working-directory: tests
        run: python -m unittest -v

      - name: JavaScript syntax
        if: runner.os == 'Linux'
        run: for f in sdk/orbit.js themes/*/scene.js templates/theme/scene.js; do node --check "$f"; done

      - name: Set up a dedicated macOS test browser
        if: runner.os == 'macOS'
        id: test-chrome
        # The runner's ordinary Chrome has stalled before its first screenshot.
        # Chrome for Testing does not run the normal browser's auto-updater.
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          chrome-version: stable

      - name: Doctor
        env:
          ORBIT_BROWSER: ${{ steps.test-chrome.outputs.chrome-path }}
        run: |
          python runtime/orbit.py init --lang en
          python runtime/orbit.py doctor

      - name: Render previews in a real browser
        if: runner.os != 'Linux'
        timeout-minutes: 12
        shell: bash
        env:
          ORBIT_BROWSER: ${{ steps.test-chrome.outputs.chrome-path }}
        run: |
          python runtime/orbit.py start
          mkdir -p previews
          for t in ink-study deep-orbit defrag-95; do
            python runtime/orbit.py snapshot "$t" --out "previews/$t-en-day.png" --query "lang=en&daypart=day"
            python runtime/orbit.py snapshot "$t" --out "previews/$t-zh-night.png" --query "lang=zh&daypart=night&weather=rain"
            python runtime/orbit.py snapshot "$t" --out "previews/$t-1366.png" --size 1366x768
          done
          python runtime/orbit.py snapshot threebody-observatory --out previews/threebody-default.png --query "lang=zh"
          python runtime/orbit.py snapshot threebody-observatory --out previews/threebody-comparison.png --query "lang=zh&review-state=comparison"
          python runtime/orbit.py snapshot genshin-sumeru --out previews/sumeru-default.png --query "lang=zh"
          python runtime/orbit.py snapshot genshin-sumeru --out previews/sumeru-bloom.png --query "lang=zh&review-state=bloom"
          python runtime/orbit.py new-theme ci-starter
          python runtime/orbit.py review ci-starter --quick --out previews/starter-review

      - name: Show helper logs after a failure
        if: failure()
        shell: bash
        run: |
          for f in "$ORBIT_WORKSPACE"/logs/*.log; do echo "== $f"; tail -n 60 "$f" || true; done
          (lsof -nP -iTCP:47321 -sTCP:LISTEN || netstat -ano | grep 47321 || true) 2>/dev/null

      - name: Stop the CI helper
        if: always() && runner.os != 'Linux'
        timeout-minutes: 2
        run: python runtime/orbit.py stop

      - name: Upload previews
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: previews-${{ runner.os }}
          include-hidden-files: true
          path: |
            previews/
            .ci-workspace/logs/
