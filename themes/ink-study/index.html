<!doctype html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨痕书房 · Ink Study</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <filter id="stamp-edge">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="grain"/>
    <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.4"/>
  </filter>
</svg>

<header class="colophon">
  <h1 class="title" data-en="Ink Study">墨痕书房</h1>
  <div class="seal" aria-hidden="true"><span>心</span><span>远</span></div>
  <div class="almanac">
    <p class="shichen" data-orbit-clock="{shichen}" data-en-clock="{h}{ampm}"></p>
    <p class="time" id="time"></p>
    <p class="date" data-orbit-clock="{cn-month}{cn-day}" data-en-clock="{mon} {D}"></p>
    <p class="weather" id="weather-line"></p>
  </div>
</header>

<nav class="desk" aria-label="书案">
  <button class="slip slip-main" id="slip-tidy" data-orbit-action="tidy-files" data-orbit-op="run">
    <span class="slip-name" data-en="Roll up">收卷</span>
    <span class="slip-note" id="pending-note">散页</span>
  </button>
  <button class="slip slip-minor" data-orbit-action="tidy-files" data-orbit-op="undo">
    <span class="slip-name" data-en="Unroll">展卷</span>
    <span class="slip-note" data-en="put back">放回原处</span>
  </button>
  <button class="slip" data-orbit-action="tidy-files" data-orbit-op="open">
    <span class="slip-name" data-en="Library">书阁</span>
    <span class="slip-note" data-en="the archive">开阁取卷</span>
  </button>
  <button class="slip slip-lamp" id="slip-lamp" data-orbit-action="quit-apps" data-orbit-op="run">
    <span class="slip-name" data-en="Lamp out">掩灯</span>
    <span class="slip-note" id="oil-note">合上诸卷</span>
  </button>
  <button class="slip slip-minor" data-orbit-action="quit-apps" data-orbit-op="reopen">
    <span class="slip-name" data-en="Relight">复明</span>
    <span class="slip-note" data-en="reopen">重开诸卷</span>
  </button>
</nav>

<p class="status" data-orbit-status></p>

<script src="../../sdk/orbit.js"></script>
<script src="scene.js"></script>
</body>
</html>
